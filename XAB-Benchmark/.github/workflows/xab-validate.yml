name: XAB-1 Benchmark Validation
on:
  push:
    paths: ['XAB-Benchmark/**']
  pull_request:
    paths: ['XAB-Benchmark/**']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m json.tool XAB-Benchmark/manifest.json >/dev/null && python -m json.tool XAB-Benchmark/cases.json >/dev/null
      - run: python XAB-Benchmark/runner.py --outputs XAB-Benchmark/example-outputs.jsonl --out /tmp/xab-report.json
      - run: test -s /tmp/xab-report.json
